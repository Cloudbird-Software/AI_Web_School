[pytest]
# tests/ 各子目录存在同名占位测试（test_smoke.py），
# 默认 prepend 导入模式会报 "import file mismatch"（Linux CI 同样触发）。
# importlib 模式为 pytest 官方推荐的同名模块共存方案。
addopts = --import-mode=importlib

# T-W1-001：pytest-asyncio 自动模式。
# 事件循环 scope：function 级（W2a-integrate 调试：session 级在 sync 测试混合
# async 测试时会让 async_session fixture 卡住；function 级更稳健）。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
