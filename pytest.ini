[pytest]
# tests/ 各子目录存在同名占位测试（test_smoke.py），
# 默认 prepend 导入模式会报 "import file mismatch"（Linux CI 同样触发）。
# importlib 模式为 pytest 官方推荐的同名模块共存方案。
addopts = --import-mode=importlib

# T-W1-001：pytest-asyncio 自动模式 + 会话级事件循环。
# 为什么 session 级：async_engine 为 session 级 fixture，需要与测试共享同一事件循环；
# function 级循环会让会话级 fixture 在跨测试时遇到 "Event loop is closed"。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
