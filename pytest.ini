[pytest]
# tests/ 各子目录存在同名占位测试（test_smoke.py），
# 默认 prepend 导入模式会报 "import file mismatch"（Linux CI 同样触发）。
# importlib 模式为 pytest 官方推荐的同名模块共存方案。
# --basetemp 收到项目内：规避 Windows 系统 Temp 中损坏的 pytest-current 链接
# 导致的 PermissionError（WinError 5）。注意：ini 的 basetemp 键在 pytest 9 不生效，
# 必须以 CLI 形式放入 addopts；.pytest_tmp 已在 .gitignore。
addopts = --import-mode=importlib --basetemp=.pytest_tmp

# T-W1-001：pytest-asyncio 自动模式。
# 事件循环 scope：function 级（W2a-integrate 调试：session 级在 sync 测试与
# async 测试混合时会让 async_session fixture 卡住；function 级更稳健）。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# T-W2-035：slow 标记用于真实 Edge/Chromium PDF 冒烟测试（CI 可 -m "not slow" 跳过）
markers =
    slow: 真实外部依赖冒烟测试（Edge headless PDF 等，本地默认跑，CI 可跳过）
