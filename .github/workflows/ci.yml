name: CI
# 组织治理基线（CI-1，ADR-0023）：PR/push 聚合 gate = 唯一 required check。
# 复用工作流来自 Cloudbird-Software/CI-Workflows@v1（集中维护，本仓不复制实现）；
# repo-gate 为本仓宪法门禁（自 pr-check.yml 迁移并入，未削弱任何一项）。
on:
  pull_request:
    # edited：任务卡引用消费可变的 PR title/body——编辑须重验
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/hygiene.yml@ce099e5853725acb04371a6018ce0ce03696dc99 # v1

  deps-audit:
    # push 面依赖审计（对齐 template-service ci.yml 同名 job；pip 侧用 pip-audit
    # 审锁定 requirements）：dependency-review 仅支持 PR 事件（比对 base↔head），
    # 直推 main 时以锁定文件审计兜底，不引入"跳过=通过"的 gate 语义漏洞。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: pip-audit（锁定文件漏洞阻断）
        run: uvx pip-audit@2.10.1 -r requirements.txt -r requirements-dev.txt

  check:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/check.yml@ce099e5853725acb04371a6018ce0ce03696dc99 # v1
    with:
      ciw-ref: ce099e5853725acb04371a6018ce0ce03696dc99
      runtime: python
      python-version: "3.12"

  deps:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/dep-review.yml@ce099e5853725acb04371a6018ce0ce03696dc99 # v1
    with:
      ciw-ref: ce099e5853725acb04371a6018ce0ce03696dc99
      # ADR-0026：psycopg-binary 在 GitHub 依赖图被归一化为 GPL-3.0-or-later
      # （PyPI 实为 LGPL-3.0-only，不在 org deny 清单 AGPL-3.0/GPL-3.0/SSPL-1.0）。
      # --require-hashes 模式要求 extras 闭包独立行（requirements.txt 头部说明），
      # 拆行后触发该误报——按 PURL 精确豁免，deny 清单本体不变。
      # T-W5-033：golang.org/x/{mod,tools} 被 dependency-review 归一化为
      # BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang（x/ 仓库
      # 附加的 Go 专利授权条款；非 copyleft，不在 org deny 清单
      # AGPL-3.0/GPL-3.0/SSPL-1.0）。与 psycopg-binary 同一误报类，按 ADR-0026
      # 先例 PURL 精确豁免；上游归一化修复后回撤。
      allow-dependencies-licenses: pkg:pypi/psycopg-binary pkg:golang/golang.org/x/mod pkg:golang/golang.org/x/tools

  repo-gate:
    # 宪法门禁（原 pr-check.yml 全量迁移）：任务卡引用 / 泄密扫描 / 反测试削弱 /
    # 核心域禁 import 学科包 / 规则同步一致性。来源登记（check_sources.py）与
    # DB 测试在 check job 的 make check 内执行。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PR 必须引用任务卡
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_TITLE $PR_BODY" \
            | grep -qE 'T-W[0-9]+-[0-9]+' || { echo "❌ PR 标题或描述必须含任务卡 id（如 T-W1-001）"; exit 1; }

      - name: 泄密扫描（X3）
        run: |
          ! git diff origin/main...HEAD | grep -inE '(api[_-]?key|secret|password|token)\s*[:=]\s*["'"'"']?[A-Za-z0-9_\-]{16,}' \
            || { echo "❌ 疑似密钥进入仓库"; exit 1; }

      - name: 反测试削弱（X1）
        run: |
          ! git diff origin/main...HEAD -- tests/ | grep -q '^-.*assert' \
            || { echo "❌ 删除既有断言"; exit 1; }
          ! git diff origin/main...HEAD -- tests/ | grep -qE '^\+.*(pytest\.mark\.(skip|xfail)\b|pytest\.(skip|xfail)\(|unittest\.skip)' \
            || { echo "❌ 新增 skip/xfail"; exit 1; }

      - name: 核心域禁止 import 学科包（X6）
        run: |
          ! grep -rnE '(import|from)\s+(packs|subject_)' src/core/ 2>/dev/null \
            || { echo "❌ 核心域引用了学科包"; exit 1; }

      - name: 规则文件同步一致性
        run: CI=true bash tools/sync_rules.sh

  test-freeze:
    # T-W5-034 测试冻结门禁（specs/test-freeze/）：受保护测试资产（holdout/契约/黄金/
    # accept 脚本/出口脚本/守卫自身）哈希级冻结；清单本体变更须 [TEST-FREEZE-APPROVE]
    # 人类标记；CODEOWNERS 已把 /tests/ /scripts/ 显式归属 owner（人审为最终防线）。
    # 工作流变更经 owner 凭据通道提交（ADR-0045：App 无 workflows 权限，.github#102）。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 哈希冻结 + 覆盖完整性
        run: python3 tools/ci/check_test_freeze.py
      - name: 清单变更须人类批准标记（仅 PR）
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1 >/dev/null 2>&1 || true
          python3 tools/ci/check_test_freeze.py --base origin/main

  contract:
    # 契约兼容性检测门（P2-4，ADR-0038）：OpenAPI/JSON Schema breaking + DB migration
    # destructive DDL 分类；policy = .github governance/policy/contracts.yaml（org 合入前
    # 用引擎内置 bootstrap 快照）。无事件条件：PR/push 两面都真跑，无 EXPECTED_SKIP 登记。
    # BOOTSTRAP 钉扎：uses 与 ciw-ref 均指向 CI-Workflows PR #18 分支提交（两处一致，
    # 被调用侧无法自取自身 ref）；其 squash 合入并走 v1.X.Y 发布四步流程后，两处同改
    # merge SHA（勿用可变 @main）。
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/contract.yml@ce099e5853725acb04371a6018ce0ce03696dc99 # v1
    with:
      ciw-ref: ce099e5853725acb04371a6018ce0ce03696dc99

  suppression-budget:
    # P2-2 抑制标记预算门（ADR-0036 / .github #87）：净增 ≤3/PR + 合入树总量棘轮
    # + ADR 逃生门。独立 reusable（v1.5.1 内嵌 check.yml 实测触发平台 action 解析
    # 故障，v1.5.3 起独立文件——ADR-0036 修订）。非 PR 事件 n/a-success（无需
    # EXPECTED_SKIP 登记）。
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/suppression-gate.yml@ce099e5853725acb04371a6018ce0ce03696dc99
    with:
      detector-ref: ce099e5853725acb04371a6018ce0ce03696dc99

  go-check:
    # T-W5-033 gate 切 Go 工具链（BRIEF S6 / ADR-0004 §三）：GO-1 gofmt / GO-2 errcheck /
    # GO-3 循环依赖由编译器与 import-boundary lint 强制 / GO-4 test -race（含 GO-5 goleak
    # TestMain）/ BAML-1 golden / SQL-1 静态成对。独立 job 而非只靠 make check 内嵌：
    # Go 工具链显式 setup-go（版本随 go.mod）+ 独立缓存与超时，Python 冻结面与 Go
    # 重建面互不拖累；无事件条件，PR/push 两面都真跑（ADR-0032：无 skipped=通过路径）。
    # SQL-2 sqlc diff 与 SQL-1 运行时可逆（check job 内 migrate-go-check）随后续 PR 接线。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: GO-1..5 / BAML-1 / SQL-1 静态面
        run: |
          make check-go sql-pairs

  gate:
    if: always()
    needs: [hygiene, deps-audit, check, deps, repo-gate, test-freeze, contract, suppression-budget, go-check]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS (event=$EVENT)"
          # 严格断言（P1-3 .github#84 / ADR-0032，standards/automation/required-check-chains.md）：
          # skipped≠success——仅下列 EXPECTED_SKIP 登记的事件互补 job 允许 skipped，
          # 未登记的 skipped 与一切非 success（failure/cancelled/timed_out/startup_failure）一律红
          case "$EVENT" in
            pull_request) EXPECTED_SKIP="deps-audit" ;;
            push)         EXPECTED_SKIP="deps repo-gate" ;;
            *)            EXPECTED_SKIP="" ;;
          esac
          BAD=$(echo "$NEEDS" | jq -r --arg skip "$EXPECTED_SKIP" '
            to_entries[]
            | . as $e
            | select(.value.result != "success")
            | select((($skip | split(" ")) | index($e.key)) == null)
            | "\($e.key)=\($e.value.result)"')
          if [[ -n "$BAD" ]]; then
            echo "::error::以下 job 非 success 且不属于事件 $EVENT 的结构性预期跳过：$BAD（skipped≠success——ADR-0032）"; exit 1
          fi
