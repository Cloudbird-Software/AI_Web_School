name: CI
# 组织治理基线（CI-1，ADR-0023）：PR/push 聚合 gate = 唯一 required check。
# 复用工作流来自 Cloudbird-Software/CI-Workflows@v1（集中维护，本仓不复制实现）；
# repo-gate 为本仓宪法门禁（自 pr-check.yml 迁移并入，未削弱任何一项）。
on:
  pull_request:
    # edited：任务卡引用消费可变的 PR title/body——编辑须重验
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/hygiene.yml@9c20d43d60e9f9d1438f171aeee8e4dbdf02c08b # v1

  deps-audit:
    # push 面依赖审计（对齐 template-service ci.yml 同名 job；pip 侧用 pip-audit
    # 审锁定 requirements）：dependency-review 仅支持 PR 事件（比对 base↔head），
    # 直推 main 时以锁定文件审计兜底，不引入"跳过=通过"的 gate 语义漏洞。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: pip-audit（锁定文件漏洞阻断）
        run: uvx pip-audit@2.10.1 -r requirements.txt -r requirements-dev.txt

  check:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/check.yml@9c20d43d60e9f9d1438f171aeee8e4dbdf02c08b # v1
    with:
      runtime: python
      python-version: "3.12"

  deps:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/dep-review.yml@9c20d43d60e9f9d1438f171aeee8e4dbdf02c08b # v1

  repo-gate:
    # 宪法门禁（原 pr-check.yml 全量迁移）：任务卡引用 / 泄密扫描 / 反测试削弱 /
    # 核心域禁 import 学科包 / 规则同步一致性。来源登记（check_sources.py）与
    # DB 测试在 check job 的 make check 内执行。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PR 必须引用任务卡
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_TITLE $PR_BODY" \
            | grep -qE 'T-W[0-9]+-[0-9]+' || { echo "❌ PR 标题或描述必须含任务卡 id（如 T-W1-001）"; exit 1; }

      - name: 泄密扫描（X3）
        run: |
          ! git diff origin/main...HEAD | grep -inE '(api[_-]?key|secret|password|token)\s*[:=]\s*["'"'"']?[A-Za-z0-9_\-]{16,}' \
            || { echo "❌ 疑似密钥进入仓库"; exit 1; }

      - name: 反测试削弱（X1）
        run: |
          ! git diff origin/main...HEAD -- tests/ | grep -q '^-.*assert' \
            || { echo "❌ 删除既有断言"; exit 1; }
          ! git diff origin/main...HEAD -- tests/ | grep -qE '^\+.*(pytest\.mark\.(skip|xfail)\b|pytest\.(skip|xfail)\(|unittest\.skip)' \
            || { echo "❌ 新增 skip/xfail"; exit 1; }

      - name: 核心域禁止 import 学科包（X6）
        run: |
          ! grep -rnE '(import|from)\s+(packs|subject_)' src/core/ 2>/dev/null \
            || { echo "❌ 核心域引用了学科包"; exit 1; }

      - name: 规则文件同步一致性
        run: CI=true bash tools/sync_rules.sh

  gate:
    if: always()
    needs: [hygiene, deps-audit, check, deps, repo-gate]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | jq -e '[toEntries[] | select(.value.result != "success" and .value.result != "skipped")] | length > 0' >/dev/null; then
            echo "::error::有 job 未通过"; exit 1
          fi
