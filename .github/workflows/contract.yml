name: contract-watch
on:
  pull_request:
    paths: ["specs/contracts/**", "src/**"]

permissions:
  contents: read

jobs:
  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 冻结契约变更检测（P5）
        run: |
          FROZEN=$(cat specs/contracts/FROZEN.txt 2>/dev/null || true)
          for f in $FROZEN; do
            git diff --quiet --diff-filter=MD origin/main...HEAD -- "$f" \
              && echo "ok: $f" \
              || { echo "❌ 冻结契约被修改: $f（须走契约变更申请）"; exit 1; }
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt -r requirements.txt
      - run: python -m pytest tests/contract -q
