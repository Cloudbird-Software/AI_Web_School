name: pr-check
on:
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: PR 必须引用任务卡
        run: |
          echo "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}" \
            | grep -qE 'T-W[0-9]+-[0-9]+' || { echo "❌ PR 标题或描述必须含任务卡 id（如 T-W1-001）"; exit 1; }

      - name: 泄密扫描（X3）
        run: |
          ! git diff origin/main...HEAD | grep -inE '(api[_-]?key|secret|password|token)\s*[:=]\s*["'"'"']?[A-Za-z0-9_\-]{16,}' \
            || { echo "❌ 疑似密钥进入仓库"; exit 1; }

      - name: 反测试削弱（X1）
        run: |
          ! git diff origin/main...HEAD -- tests/ | grep -q '^-.*assert' \
            || { echo "❌ 删除既有断言"; exit 1; }
          ! git diff origin/main...HEAD -- tests/ | grep -qE '^\+.*(skip|xfail)' \
            || { echo "❌ 新增 skip/xfail"; exit 1; }

      - name: 核心域禁止 import 学科包（X6）
        run: |
          ! grep -rnE '(import|from)\s+(packs|subject_)' src/core/ 2>/dev/null \
            || { echo "❌ 核心域引用了学科包"; exit 1; }

      - name: 规则文件同步一致性
        run: CI=true bash tools/sync_rules.sh

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pip install -r requirements.txt   # 生产依赖（W1 起 tests/unit import src/ 代码）
      - name: 来源登记表 CI 拦截（T-W2-015）
        run: python tools/ci/check_sources.py
      - name: 准备 .env 与数据库（W1 起 tests/unit 含 DB 测试）
        run: |
          cp .env.example .env
          docker compose up -d --wait db
      - name: 数据库迁移至 head
        run: alembic upgrade head
      - run: python -m pytest tests/contract tests/golden -q
      - run: if [ -d tests/unit ]; then python -m pytest tests/unit -q; fi
      - run: GOLDEN_PATH_QUICK=1 python -m pytest tests/golden-path -q
