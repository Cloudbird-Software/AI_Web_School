name: nightly
on:
  schedule: [{cron: "0 17 * * *"}]   # 每日 01:00 北京
  workflow_dispatch:

# 组织基线 CI-3：默认只读之上仅放开 issue 创建（失败红灯置顶步骤需要）
permissions:
  contents: read
  issues: write

jobs:
  full-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # 哈希锁定安装（T-W0-010）：生产+开发依赖一次装齐，--require-hashes 强校验
      - run: pip install --require-hashes -r requirements-dev.txt -r requirements.txt

      - name: 准备 .env（CI 无密钥，示例值仅供本地容器）
        run: cp .env.example .env

      - name: 全栈地基启动
        run: docker compose up -d --wait

      - name: 迁移可逆演练（upgrade→downgrade→upgrade）
        run: make migrate-check

      - name: 种子数据重灌 + 黄金数据集回归
        run: python -m pytest tests/golden -q

      - name: 黄金路径全量（30 题型）
        run: python -m pytest tests/golden-path -q

      - name: 契约测试全量
        run: python -m pytest tests/contract -q

      # W2 出口检查（T-W2-045）：黄金回归上面已覆盖；此处执行 w2.sh 出口脚本。
      # w2.sh 内含 E2E-1 现场演示（生成真实 PDF）：ubuntu 无 Edge，
      # demo 自动回退 playwright 后端，需先安装 chromium 浏览器二进制。
      - name: W2 出口检查（w2.sh，含 E2E-1 真实 PDF 演示）
        run: |
          python -m playwright install --with-deps chromium
          bash scripts/wave-exit/w2.sh

      - name: 失败即创建 issue（红灯置顶）
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: `🔴 Nightly 失败 ${new Date().toISOString().slice(0,10)}`,
              body: "见 Actions 日志。按宪法 P4：红灯为全项目最高优先级。"})
