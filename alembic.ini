# Alembic config (T-W0-005)
# NOTE: sqlalchemy.url is intentionally empty -- the real DSN is assembled at
# runtime by alembic/env.py from POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# / POSTGRES_HOST / POSTGRES_PORT env vars. Never hardcode passwords here (X3).
# All DDL must go through migrations; never edit the DB by hand (X7).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
