  template_id: tpl-sc-shopping
  dsl_version: '1'
  spec:
    objective:
      kp_set:
      - dimension: kp
        code: math.nal.int.sub
      kp_set_mode: single
      cognitive_level: apply
      gradeband: L
      graph_release: '2026.1'
    slots:
      pay:
        type: int
        difficulty_relevant: true
      price:
        type: int
        difficulty_relevant: true
    variation_axes:
      axes: []
    presentation:
      blocks:
      - kind: text
        template: 小明付了 {pay} 元，买文具花了 {price} 元，应找回多少元？
    answer_program:
      expression: pay - price
      returns: number
    distractor_rules:
      rules:
      - rule_type: deterministic
        error_type_id: err.shop.add
        expression: pay + price
        label: 相加
      - rule_type: deterministic
        error_type_id: err.shop.off-by-one
        expression: pay - price + 1
        label: 多1
      - rule_type: deterministic
        error_type_id: err.shop.mul
        expression: pay * price
        label: 相乘
params:
  pay: 50
  price: 32
