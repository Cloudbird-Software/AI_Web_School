# W2 默认门策略矩阵
# 来源：架构 v2 §4.3；T-W2-008 落地。
# 通用链（platform）覆盖全部产物类型；学科链（subject-math）为 skeleton，学科验证器由数学包注册后追加。
# 廉价先行顺序：schema（结构）→ license（许可）→ duplicate_placeholder（查重占位）。
# 阻断项：schema/license 为阻断（fail 短路）；duplicate_placeholder 为 review 类（重复提示，不阻断）。
#
# W3 适配（S9-② item 业务适配）：license 验证器只对 material/corpus 类产物强制——
# item 是规则/模板产物，许可义务在其引用的素材/语料（material/corpus）侧校验；
# item 链保留 license 步骤（链结构冻结），但 LicenseValidator v1.1.0 起：
# artifact_type='item' 且无 license_id 时返回 pass（跳过，见 evidence.skipped），
# 显式携带 license_id 的 item 仍照常校验。material/corpus/audio 缺失 license_id 仍 fail。
policy_version: "gate-policy-v1"
status: frozen-candidate
description: "W2 默认门策略：通用链（schema→license→duplicate_placeholder）覆盖全产物类型 + 数学包 skeleton"

chains:
  # ── 通用链（platform）：全部产物类型走同一套通用验证器 ──
  - pack_id: platform
    artifact_type: item
    validators:
      - validator_id: schema
        blocking: true
      - validator_id: license
        blocking: true
      - validator_id: duplicate_placeholder
        blocking: false   # 查重提示：重复返回 review，不阻断签发

  - pack_id: platform
    artifact_type: material
    validators:
      - validator_id: schema
        blocking: true
      - validator_id: license
        blocking: true
      - validator_id: duplicate_placeholder
        blocking: false

  - pack_id: platform
    artifact_type: corpus
    validators:
      - validator_id: schema
        blocking: true
      - validator_id: license
        blocking: true
      - validator_id: duplicate_placeholder
        blocking: false

  - pack_id: platform
    artifact_type: group
    validators:
      - validator_id: schema
        blocking: true
      - validator_id: duplicate_placeholder
        blocking: false
    # group 无 license（题组引用素材版本，许可在素材侧校验）

  - pack_id: platform
    artifact_type: blueprint
    validators:
      - validator_id: schema
        blocking: true

  - pack_id: platform
    artifact_type: audio
    validators:
      - validator_id: schema
        blocking: true
      - validator_id: license
        blocking: true
      - validator_id: duplicate_placeholder
        blocking: false

  # ── T-W4-014 语篇链（passage）：跨学科通用，三道语篇专用门 ──
  # 顺序：schema（结构）→ license（许可）→ passage_fact_check（事实安全）
  #   → passage_age_appropriate（适龄）→ passage_difficulty_gate（难度一致性）
  #   → duplicate_placeholder（查重提示）
  # 阻断项：schema/license/fact_check/age_appropriate/difficulty_gate 为阻断；
  #   duplicate_placeholder 为 review 类（重复提示，不阻断）。
  # fact_check 通常返回 review（常识正确性需人工复核），不阻断；命中敏感词才 fail。
  - pack_id: platform
    artifact_type: passage
    validators:
      - validator_id: schema
        blocking: true
      - validator_id: license
        blocking: true
      - validator_id: passage_fact_check
        blocking: true
      - validator_id: passage_age_appropriate
        blocking: true
      - validator_id: passage_difficulty_gate
        blocking: true
      - validator_id: duplicate_placeholder
        blocking: false

  # ── 数学包链（subject-math）：skeleton，学科验证器待数学包注册后追加 ──
  - pack_id: subject-math
    artifact_type: item
    validators:
      - validator_id: schema
        blocking: true
      - validator_id: license
        blocking: true
      - validator_id: duplicate_placeholder
        blocking: false
      # 学科验证器位（如 math_dual_impl / math_solvability）由数学包注册后在此追加

  # ── 语文包链（subject-chinese）：T-W2-032 落地 ──
  # 注意：char_in_corpus 验证器由 src/packs/subject-chinese/validators/char_in_corpus.py
  # 运行时注册（importlib 加载），策略加载前须先 import 该模块。
  # 管线脚本与单测手动加载该模块后调用 issue_certificate，不依赖本默认策略链。
  # 后续波次可由 app 启动时统一 import 学科包模块，再加载本策略。
  # - pack_id: subject-chinese
  #   artifact_type: item
  #   validators:
  #     - validator_id: schema
  #       blocking: true
  #     - validator_id: license
  #       blocking: true
  #     - validator_id: char_in_corpus
  #       blocking: true
  #     - validator_id: duplicate_placeholder
  #       blocking: false
