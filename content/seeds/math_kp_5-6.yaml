  - {code: math.nal.algebra.equation, title: 简易方程（等式的性质）, std_anchor: 课标2022.nal.5-6.5, gradeband: H}
  - {code: math.nal.algebra.word_problem, title: 列方程解决实际问题, std_anchor: 课标2022.nal.5-6.5, gradeband: H}

