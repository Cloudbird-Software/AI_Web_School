# 数学 5-6 年级知识图谱种子数据（审计卡 #149 知识点种子补齐）
#
# 锚定课标：义务教育数学课程标准（2022 年版）第三学段（5-6 年级）。
# 覆盖四大领域代表性知识点：数与代数 / 图形与几何 / 统计与概率 / 综合与实践。
#
# 节点编码命名约定（对齐 math_kp_3-4.yaml）：math.{domain}.{topic}.{subtopic}
#   domain ∈ {nal 数与代数, geo 图形与几何, sp 统计与概率, cp 综合与实践}
#   全部 dimension=kp，pack_id=subject-math，gradeband=H（第三学段，显式标注）
#   code 在同 pack 内全局唯一（uq_kp_node_pack_dim_code 不分学段）——与
#   math_kp_3-4.yaml / math_kp_1-2.yaml 既有 code 逐一避让。
#
# 课标常识红线：分数乘除建立在分数加减与整数乘除之后；比与比例建立在
# 分数除法之后；百分数与比互为表里；图形面积按"转化"递进（平行四边形→
# 三角形→梯形），体积建立在体积单位与表面积之后；负数与简易方程是本
# 学段代数萌芽的入口。
#
# 边类型（与 relation_type 表一致）：
#   prerequisite 先修（transitive=true，方向，acyclic）
#   confusable   易混淆（对称，非传递）
#   composes     组成（A 是 B 的子部分）
#
# 幂等约定：seed_loader 按 (pack_id, dimension, code) 查重节点，
#           按 (src_node_id, dst_node_id, rel_type) 查重边；
#           重复导入 = skip，不抛错。

version: "1.0"
pack_id: subject-math
graph_release_id: "2026.1.math-5-6"

relation_types:
  - rel_type: prerequisite
    directed: true
    transitive: true
    acyclic: true
    symmetric: false
    description: 先修关系（传递闭包展开）
  - rel_type: confusable
    directed: false
    transitive: false
    acyclic: false
    symmetric: true
    description: 易混淆关系（对称，非传递）
  - rel_type: composes
    directed: true
    transitive: true
    acyclic: true
    symmetric: false
    description: 组成关系（A 是 B 的子部分）

# ────────────────────────────────────────────────────────────────────
# 节点：5-6 年级数学知识点（dimension=kp，gradeband=H 固定）
# ────────────────────────────────────────────────────────────────────
nodes:

  # ─── 数与代数 nal ───
  # 小数（运算深化）
  - {code: math.nal.decimal.mul, title: 小数乘法, std_anchor: 课标2022.nal.5-6.1, gradeband: H}
  - {code: math.nal.decimal.div, title: 小数除法, std_anchor: 课标2022.nal.5-6.1, gradeband: H}
  - {code: math.nal.decimal.four_op, title: 小数四则混合运算, std_anchor: 课标2022.nal.5-6.1, gradeband: H}

  # 分数（意义与运算系统化）
  - {code: math.nal.fraction.nature, title: 分数的意义与基本性质（约分、通分）, std_anchor: 课标2022.nal.5-6.1, gradeband: H}
  - {code: math.nal.fraction.frac_decimal, title: 分数与小数的互化, std_anchor: 课标2022.nal.5-6.1, gradeband: H}
  - {code: math.nal.fraction.add_sub, title: 异分母分数加减法, std_anchor: 课标2022.nal.5-6.1, gradeband: H}
  - {code: math.nal.fraction.mul, title: 分数乘法, std_anchor: 课标2022.nal.5-6.1, gradeband: H}
  - {code: math.nal.fraction.div, title: 分数除法, std_anchor: 课标2022.nal.5-6.1, gradeband: H}
  - {code: math.nal.fraction.mixed_op, title: 分数四则混合运算, std_anchor: 课标2022.nal.5-6.1, gradeband: H}

  # 因数与倍数
