  - {code: math.nal.factor_multiples.prime, title: 质数、合数与奇偶性, std_anchor: 课标2022.nal.5-6.2, gradeband: H}
  - {code: math.nal.factor_multiples.gcd_lcm, title: 公因数与公倍数, std_anchor: 课标2022.nal.5-6.2, gradeband: H}

