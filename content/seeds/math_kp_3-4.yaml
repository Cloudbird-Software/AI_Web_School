# 数学 3-4 年级首批知识图谱种子数据（T-W2-014）
#
# 锚定课标：义务教育数学课程标准（2022 年版）第二学段（3-4 年级）。
# 覆盖四大领域代表性知识点：数与代数 / 图形与几何 / 统计与概率 / 综合与实践。
#
# 节点编码命名约定（验收 #3）：math.{domain}.{topic}.{subtopic}
#   domain ∈ {nal 数与代数, geo 图形与几何, sp 统计与概率, cp 综合与实践}
#   全部 dimension=kp，pack_id=subject-math，gradeband=M（第二学段）
#
# 边类型（与 relation_type 表一致）：
#   prerequisite 先修（transitive=true，方向，acyclic）
#   confusable   易混淆（symmetric=true，非传递）
#   composes     组成（transitive=true，方向，acyclic，A 是 B 的子部分）
#
# 幂等约定：seed_loader 按 (pack_id, dimension, code) 查重节点，
#           按 (src_node_id, dst_node_id, rel_type) 查重边；
#           重复导入 = skip，不抛错。

version: "1.0"
pack_id: subject-math
graph_release_id: "2026.1.math-3-4"

relation_types:
  - rel_type: prerequisite
    directed: true
    transitive: true
    acyclic: true
    symmetric: false
    description: 先修关系（传递闭包展开）
  - rel_type: confusable
    directed: false
    transitive: false
    acyclic: false
    symmetric: true
    description: 易混淆关系（对称，非传递）
  - rel_type: composes
    directed: true
    transitive: true
    acyclic: true
    symmetric: false
    description: 组成关系（A 是 B 的子部分）

